name: Oracle Heartbeat (Binance Live Price)

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  refresh-oracle:
    name: Refresh Live BTC Oracle on Arc Testnet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Refresh Oracle Price
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "::error::DEPLOYER_PRIVATE_KEY secret is not configured"
            exit 1
          fi
          node scripts/refresh-mock-oracle.mjs --live
